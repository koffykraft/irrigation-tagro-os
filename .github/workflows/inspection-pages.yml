name: Deploy Iteration 01 Inspection

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/inspection-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: irrigation-inspection-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout inspection branch
        uses: actions/checkout@v4
        with:
          ref: iteration-01
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload inspection prototype
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./prototype
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
