<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f3ee">
<title>TAGRO Irrigation OS</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/docks.css">
</head>
<body>
<div id="app" class="app-shell">
  <header class="app-topbar">
    <button class="icon-button" id="toggleLeft" aria-label="Toggle navigation">☰</button>
    <div class="brand-block"><strong>TAGRO</strong><span>Irrigation OS</span></div>
    <div class="topbar-spacer"></div>
    <button class="text-button" id="layoutMode">Arrange</button>
    <button class="icon-button" id="toggleRight" aria-label="Toggle context">◫</button>
  </header>

  <aside class="sidebar sidebar-left" id="leftSidebar">
    <div class="sidebar-title">Pages</div>
    <nav id="pageNav" class="page-nav"></nav>
    <div class="sidebar-footer">
      <button class="secondary-button full" id="openLibrary">Component library</button>
    </div>
  </aside>

  <main class="workspace">
    <div class="workspace-head">
      <div><div class="eyebrow" id="pageEyebrow">MOTHERSHIP</div><h1 id="pageTitle">Farm</h1><p id="pageDescription">The working farm context.</p></div>
      <div class="workspace-actions"><button class="secondary-button" id="movePageLeft">← Page</button><button class="secondary-button" id="movePageRight">Page →</button></div>
    </div>
    <section id="dockGrid" class="dock-grid" aria-live="polite"></section>
  </main>

  <aside class="sidebar sidebar-right" id="rightSidebar">
    <div class="sidebar-title">Context</div>
    <div id="contextPanel" class="context-panel"></div>
    <div class="sidebar-title">Ripple</div>
    <div id="ripplePanel" class="ripple-panel"></div>
  </aside>

  <nav id="mobileNav" class="mobile-nav"></nav>
</div>

<div class="drawer" id="libraryDrawer" aria-hidden="true">
  <div class="drawer-sheet">
    <div class="drawer-head"><div><div class="eyebrow">DOCK LIBRARY</div><h2>Add to this page</h2></div><button class="icon-button" id="closeLibrary">×</button></div>
    <div class="control-row"><label>Tile scale <input id="tileScale" type="range" min="0.8" max="1.35" step="0.05" value="1"></label><label>Left width <input id="leftWidth" type="range" min="190" max="360" step="10" value="240"></label><label>Right width <input id="rightWidth" type="range" min="220" max="420" step="10" value="300"></label></div>
    <div id="libraryGrid" class="library-grid"></div>
    <div class="drawer-actions"><button class="secondary-button" id="exportLayout">Export layout</button><button class="secondary-button" id="resetLayout">Reset layout</button></div>
  </div>
</div>

<script type="module" src="core/app.js"></script>
</body>
</html>
