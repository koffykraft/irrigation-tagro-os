<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAGRO Design</title><style>body{font-family:system-ui;margin:0;background:#f6f7f5;color:#202420}header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #ddd}a{color:#075d9e;text-decoration:none;font-weight:700}main{padding:14px;max-width:800px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k{font-size:11px;color:#707770}.v{font-weight:800;margin-top:2px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:7px;border-bottom:1px solid #eee}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="location-map.html">← Map / Sketch</a><b>Design</b><a href="materials.html">Materials</a><a href="reference.html">Info</a></header><main><div id="summary" class="card">Loading saved Trial workspace…</div><div class="card"><table><thead><tr><th>Object</th><th>Role</th><th>Pipe</th><th>Emitter</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const KEY='tagro.v16.trial.workspace.v1',d=JSON.parse(localStorage.getItem(KEY)||'null'),layers=d?.layers||[];const roles=['main','submain','lateral'];const pipes=layers.filter(x=>roles.includes(x.identity));const emit=pipes.filter(x=>x.emitter);document.querySelector('#summary').innerHTML=`<div class="grid"><div><div class="k">Saved</div><div class="v">${d?.savedAt?new Date(d.savedAt).toLocaleString():'No saved design'}</div></div><div><div class="k">Pipe objects</div><div class="v">${pipes.length}</div></div><div><div class="k">Mains / Submains / Laterals</div><div class="v">${roles.map(r=>pipes.filter(x=>x.identity===r).length).join(' / ')}</div></div><div><div class="k">Emitter-configured laterals</div><div class="v">${emit.length}</div></div></div>`;document.querySelector('#rows').innerHTML=pipes.map((x,i)=>`<tr><td>${i+1}</td><td>${x.identity||'—'}</td><td>${x.engineering?.size?x.engineering.size+' mm':'—'}</td><td>${x.emitter?.dischargeLph?x.emitter.dischargeLph+' LPH @ '+(x.emitter.spacingM||'—')+' m':'—'}</td></tr>`).join('')||'<tr><td colspan="4">No pipe objects saved yet.</td></tr>';</script></body></html>
