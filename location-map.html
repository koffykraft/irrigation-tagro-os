<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>THUMPASSERY AGRO - Location Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111;color:#111}button,input,select,textarea{font:inherit}.page{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr}.titlebar{display:flex;align-items:center;gap:6px;padding:0 6px;background:#fff;border-bottom:1px solid #d9ded9;z-index:1000}.drawbtn{height:28px;width:34px;border:1px solid #cfd4cf;border-radius:7px;background:#fff;font-size:15px}.title{font-size:10.5px;font-weight:800;white-space:nowrap}.controls{margin-left:auto;display:flex;gap:5px}.search{display:flex;width:128px;height:28px;border:1px solid #cfd4cf;border-radius:8px;overflow:hidden;background:#fff}.search input{width:100%;border:0;outline:0;padding:0 6px;font-size:11px;min-width:0}.search button,.locate{width:28px;border:0;background:#fff}.locate{height:28px;border:1px solid #cfd4cf;border-radius:8px}.mapwrap{position:relative;min-height:0}#map{position:absolute;inset:0;background:#d7d7d7}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.78)!important}
.palette{position:absolute;inset:0;z-index:1600;background:#fff;display:none;overflow:auto}.palette.open{display:block}.palhead{height:52px;background:#5b5b5b;color:#fff;display:grid;grid-template-columns:52px 1fr 52px;align-items:center}.palhead button{height:52px;border:0;background:transparent;color:#fff;font-size:24px}.palhead strong{text-align:center;font-size:18px;font-weight:500}.palbody{max-width:720px;margin:auto;padding:16px 12px 34px}.toolgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#f1f1f3;padding:6px;border-radius:12px}.tool{border:0;background:transparent;border-radius:9px;padding:8px 3px;min-height:62px}.tool.on{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.13)}.ico{height:28px;display:grid;place-items:center;font-size:21px}.lbl{display:block;font-size:10px;margin-top:4px}.panel{margin-top:14px;border:1px solid #e2e2e2;border-radius:12px;padding:12px;background:#fafafa}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:8px 0}.row label{font-size:12px;color:#555}.swatches{display:flex;gap:8px;flex-wrap:wrap}.sw{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #bbb}.sw.on{box-shadow:0 0 0 3px #111}.range{width:min(360px,72vw)}.num{min-width:38px;font-weight:700}.seg{display:flex;gap:6px;flex-wrap:wrap}.seg button,.smallbtn{border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:7px 10px;font-size:12px}.seg button.on{border-color:#178be8;background:#eaf5ff;color:#075d9e;font-weight:700}.textopts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.textopts input,.textopts select,.textopts textarea{width:100%;border:1px solid #ccc;border-radius:8px;padding:8px;background:#fff}.textopts textarea{grid-column:1/-1;min-height:66px;resize:vertical}.statusbar{position:absolute;right:8px;top:8px;z-index:1400;display:none;background:rgba(255,255,255,.96);border:1px solid #cfd4cf;border-radius:9px;overflow:hidden;box-shadow:0 3px 12px rgba(0,0,0,.14)}.statusbar.show{display:flex}.statusbar span{padding:8px 10px;font-size:12px;font-weight:800}.statusbar button{border:0;border-left:1px solid #ddd;background:#fff;padding:0 10px}.vertex{width:16px;height:16px;border-radius:50%;background:#fff;border:3px solid #111;box-shadow:0 1px 4px rgba(0,0,0,.3)}.shape-label{white-space:nowrap;font-weight:600;text-shadow:0 1px 2px rgba(255,255,255,.8)}
@media(max-width:390px){.title{font-size:9.3px}.search{width:108px}.toolgrid{grid-template-columns:repeat(4,1fr)}.palbody{padding:12px 9px 28px}}
</style>
</head>
<body>
<div class="page"><header class="titlebar"><button id="drawBtn" class="drawbtn">✎</button><div class="title">THUMPASSERY AGRO&nbsp; - &nbsp;Location Map</div><div class="controls"><div class="search"><input id="q" placeholder="Search place"><button id="go">⌕</button></div><button id="locate" class="locate">◎</button></div></header><main class="mapwrap"><div id="map"></div><div id="statusbar" class="statusbar"><span id="statusText">Drawing</span><button id="finish">✓</button><button id="cancel">×</button></div></main></div>
<section id="palette" class="palette"><div class="palhead"><button id="palDone">☑</button><strong>Palette</strong><span></span></div><div class="palbody">
<div class="toolgrid" id="toolgrid">
<button class="tool on" data-tool="line"><span class="ico">╱</span><span class="lbl">Line</span></button>
<button class="tool" data-tool="point"><span class="ico">●</span><span class="lbl">Point</span></button>
<button class="tool" data-tool="circle"><span class="ico">○</span><span class="lbl">Circle</span></button>
<button class="tool" data-tool="square"><span class="ico">□</span><span class="lbl">Square</span></button>
<button class="tool" data-tool="triangle"><span class="ico">△</span><span class="lbl">Triangle</span></button>
<button class="tool" data-tool="text"><span class="ico">T</span><span class="lbl">Text</span></button>
<button class="tool" data-tool="select"><span class="ico">↖</span><span class="lbl">Select / Move</span></button>
<button class="tool" data-tool="delete"><span class="ico">⌫</span><span class="lbl">Delete</span></button>
</div>
<div class="panel" id="options"></div>
</div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false,doubleClickZoom:true,maxZoom:23,minZoom:3,worldCopyJump:true}).setView([9.015,76.925],17);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:23,attribution:'Esri, Maxar, Earthstar Geographics, and the GIS User Community'}).addTo(map);
const $=s=>document.querySelector(s),palette=$('#palette'),options=$('#options'),statusbar=$('#statusbar'),statusText=$('#statusText');
const colors=['#111111','#ffffff','#e53935','#f6d32d','#2f9e44','#1976d2','#7b2cbf','#f08c00'];
let tool='line',stroke='#111111',fill='#1976d2',width=4,size=28,filled=false,font='Arial',fontSize=18,fontColor='#111111',bgColor='#ffffff',bgOn=false,draft=null,selected=null,objects=[],vertexMarkers=[],locationMarker=null;
function swatches(kind,current){return `<div class="swatches">${colors.map(c=>`<button class="sw ${current===c?'on':''}" data-${kind}="${c}" style="background:${c}"></button>`).join('')}</div>`}
function renderOptions(){
 let html='';
 if(tool==='line')html=`<div class="row"><label>Thickness</label><input id="width" class="range" type="range" min="1" max="14" value="${width}"><span class="num">${width}</span></div><div class="row"><label>Line colour</label>${swatches('stroke',stroke)}</div>`;
 else if(['point','circle','square','triangle'].includes(tool))html=`<div class="row"><label>Size</label><input id="size" class="range" type="range" min="8" max="90" value="${size}"><span class="num">${size}</span></div><div class="row"><div class="seg"><button data-fillmode="outline" class="${!filled?'on':''}">Outline</button><button data-fillmode="filled" class="${filled?'on':''}">Filled</button></div></div><div class="row"><label>Line colour</label>${swatches('stroke',stroke)}</div><div class="row"><label>Fill colour</label>${swatches('fill',fill)}</div>`;
 else if(tool==='text')html=`<div class="textopts"><textarea id="textValue" placeholder="Enter text"></textarea><select id="fontSel"><option>Arial</option><option>Georgia</option><option>Courier New</option><option>Trebuchet MS</option></select><input id="fontSize" type="number" min="10" max="52" value="${fontSize}" placeholder="Font size"><label><input id="bgOn" type="checkbox" ${bgOn?'checked':''}> Background</label></div><div class="row"><label>Font colour</label>${swatches('font',fontColor)}</div><div class="row"><label>Background</label>${swatches('bg',bgColor)}</div>`;
 else if(tool==='select')html='<div class="row"><span style="font-size:12px">Tap an object. Its points/position become movable.</span></div>';
 else html='<div class="row"><span style="font-size:12px">Tap an object to delete it.</span></div>';
 options.innerHTML=html;
 const w=$('#width');if(w)w.oninput=()=>{width=+w.value;renderOptions()};const s=$('#size');if(s)s.oninput=()=>{size=+s.value;renderOptions()};
 options.querySelectorAll('[data-stroke]').forEach(b=>b.onclick=()=>{stroke=b.dataset.stroke;renderOptions()});options.querySelectorAll('[data-fill]').forEach(b=>b.onclick=()=>{fill=b.dataset.fill;renderOptions()});options.querySelectorAll('[data-font]').forEach(b=>b.onclick=()=>{fontColor=b.dataset.font;renderOptions()});options.querySelectorAll('[data-bg]').forEach(b=>b.onclick=()=>{bgColor=b.dataset.bg;renderOptions()});options.querySelectorAll('[data-fillmode]').forEach(b=>b.onclick=()=>{filled=b.dataset.fillmode==='filled';renderOptions()});
 const fs=$('#fontSel');if(fs)fs.onchange=()=>font=fs.value;const fz=$('#fontSize');if(fz)fz.oninput=()=>fontSize=+fz.value;const bo=$('#bgOn');if(bo)bo.onchange=()=>bgOn=bo.checked;
}
renderOptions();
$('#drawBtn').onclick=()=>palette.classList.add('open');$('#palDone').onclick=()=>{palette.classList.remove('open');startMode()};$('#toolgrid').onclick=e=>{const b=e.target.closest('.tool');if(!b)return;tool=b.dataset.tool;document.querySelectorAll('.tool').forEach(x=>x.classList.toggle('on',x===b));renderOptions()};
function startMode(){clearDraft();clearSelection();if(['line','circle','square','triangle'].includes(tool)){draft={tool,points:[],layer:null};statusText.textContent=tool[0].toUpperCase()+tool.slice(1);statusbar.classList.add('show');map.doubleClickZoom.disable()}else statusbar.classList.remove('show')}
function clearDraft(){if(draft&&draft.layer&&map.hasLayer(draft.layer))map.removeLayer(draft.layer);draft=null;map.doubleClickZoom.enable()}
function clearSelection(){vertexMarkers.forEach(m=>map.hasLayer(m)&&map.removeLayer(m));vertexMarkers=[];selected=null}
function vertexIcon(){return L.divIcon({className:'',html:'<div class="vertex"></div>',iconSize:[16,16],iconAnchor:[8,8]})}
function redrawDraft(){if(!draft)return;if(draft.layer&&map.hasLayer(draft.layer))map.removeLayer(draft.layer);if(!draft.points.length)return;if(draft.tool==='line')draft.layer=L.polyline(draft.points,{color:stroke,weight:width}).addTo(map);else if(draft.tool==='circle'&&draft.points.length>=2){const r=map.distance(draft.points[0],draft.points[1]);draft.layer=L.circle(draft.points[0],{radius:r,color:stroke,weight:2,fillColor:fill,fillOpacity:filled?.55:0}).addTo(map)}else if(draft.tool==='square'&&draft.points.length>=2){const a=draft.points[0],b=draft.points[1],bounds=L.latLngBounds(a,b);draft.layer=L.rectangle(bounds,{color:stroke,weight:2,fillColor:fill,fillOpacity:filled?.55:0}).addTo(map)}else if(draft.tool==='triangle'&&draft.points.length>=3)draft.layer=L.polygon(draft.points.slice(0,3),{color:stroke,weight:2,fillColor:fill,fillOpacity:filled?.55:0}).addTo(map)}
function finishDraft(){if(!draft)return;const need=draft.tool==='line'?2:draft.tool==='triangle'?3:2;if(draft.points.length<need)return;let o={tool:draft.tool,points:draft.points.slice(),stroke,fill,width,size,filled,layer:null};clearDraft();if(o.tool==='line')o.layer=L.polyline(o.points,{color:o.stroke,weight:o.width}).addTo(map);else if(o.tool==='circle'){o.radius=map.distance(o.points[0],o.points[1]);o.layer=L.circle(o.points[0],{radius:o.radius,color:o.stroke,weight:2,fillColor:o.fill,fillOpacity:o.filled?.55:0}).addTo(map)}else if(o.tool==='square'){o.layer=L.rectangle(L.latLngBounds(o.points[0],o.points[1]),{color:o.stroke,weight:2,fillColor:o.fill,fillOpacity:o.filled?.55:0}).addTo(map)}else o.layer=L.polygon(o.points.slice(0,3),{color:o.stroke,weight:2,fillColor:o.fill,fillOpacity:o.filled?.55:0}).addTo(map);wireObject(o);objects.push(o);statusbar.classList.remove('show')}
$('#finish').onclick=finishDraft;$('#cancel').onclick=()=>{clearDraft();statusbar.classList.remove('show')};
map.on('click',e=>{if(palette.classList.contains('open'))return;if(draft){draft.points.push(e.latlng);redrawDraft();if(['circle','square'].includes(draft.tool)&&draft.points.length===2)finishDraft();if(draft.tool==='triangle'&&draft.points.length===3)finishDraft();return}if(tool==='point'){const o={tool:'point',point:e.latlng,stroke,fill,size,filled,layer:L.circleMarker(e.latlng,{radius:size/6,color:stroke,weight:2,fillColor:filled?fill:stroke,fillOpacity:1}).addTo(map)};wireObject(o);objects.push(o);return}if(tool==='text'){const text=($('#textValue')?.value||'Text').trim()||'Text';const html=`<div class="shape-label" style="font-family:${font};font-size:${fontSize}px;color:${fontColor};${bgOn?`background:${bgColor};padding:2px 4px;border-radius:3px;`:''}">${text.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}</div>`;const o={tool:'text',point:e.latlng,html,layer:L.marker(e.latlng,{icon:L.divIcon({className:'',html,iconAnchor:[0,0]})}).addTo(map)};wireObject(o);objects.push(o);return}clearSelection()});
function wireObject(o){o.layer.on('click',e=>{L.DomEvent.stopPropagation(e);if(tool==='delete'){map.removeLayer(o.layer);objects=objects.filter(x=>x!==o);clearSelection();return}if(tool==='select')selectObject(o)})}
function selectObject(o){clearSelection();selected=o;if(o.tool==='line'||o.tool==='triangle'){o.points.forEach((p,i)=>{const m=L.marker(p,{draggable:true,icon:vertexIcon()}).addTo(map);m.on('drag',ev=>{o.points[i]=ev.target.getLatLng();if(o.tool==='line')o.layer.setLatLngs(o.points);else o.layer.setLatLngs(o.points.slice(0,3))});vertexMarkers.push(m)})}else if(o.tool==='circle'){const c=L.marker(o.points[0],{draggable:true,icon:vertexIcon()}).addTo(map),r=L.marker(o.points[1],{draggable:true,icon:vertexIcon()}).addTo(map);c.on('drag',ev=>{const old=o.points[0],nw=ev.target.getLatLng(),dlat=nw.lat-old.lat,dlng=nw.lng-old.lng;o.points[0]=nw;o.points[1]=L.latLng(o.points[1].lat+dlat,o.points[1].lng+dlng);r.setLatLng(o.points[1]);o.layer.setLatLng(nw)});r.on('drag',ev=>{o.points[1]=ev.target.getLatLng();o.radius=map.distance(o.points[0],o.points[1]);o.layer.setRadius(o.radius)});vertexMarkers.push(c,r)}else if(o.tool==='square'){o.points.forEach((p,i)=>{const m=L.marker(p,{draggable:true,icon:vertexIcon()}).addTo(map);m.on('drag',ev=>{o.points[i]=ev.target.getLatLng();o.layer.setBounds(L.latLngBounds(o.points[0],o.points[1]))});vertexMarkers.push(m)})}else if(o.tool==='point'||o.tool==='text'){const p=o.point;const m=L.marker(p,{draggable:true,icon:vertexIcon()}).addTo(map);m.on('drag',ev=>{o.point=ev.target.getLatLng();o.layer.setLatLng(o.point)});vertexMarkers.push(m)}}
async function searchPlace(){const v=$('#q').value.trim();if(!v)return;const c=v.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(c){map.setView([+c[1],+c[2]],19);return}try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(v));const d=await r.json();if(d[0])map.setView([+d[0].lat,+d[0].lon],19)}catch(e){}}
$('#go').onclick=searchPlace;$('#q').onkeydown=e=>{if(e.key==='Enter')searchPlace()};$('#locate').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,19);if(locationMarker)locationMarker.setLatLng(ll);else locationMarker=L.circleMarker(ll,{radius:6,weight:2,color:'#fff',fillColor:'#1677ff',fillOpacity:1,interactive:false}).addTo(map)},()=>{},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
</script>
</body>
</html>
