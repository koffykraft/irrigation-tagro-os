<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>THUMPASSERY AGRO - Location Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}button,input{font:inherit}.page{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr}.titlebar{display:flex;align-items:center;gap:6px;padding:0 6px;background:#fff;border-bottom:1px solid #d9ded9;color:#172019;z-index:1000;position:relative}.toolmenu{position:relative;flex:0 0 auto}.tooltoggle{height:28px;width:34px;border:1px solid rgba(20,30,22,.18);border-radius:7px;background:#fff;color:#172019;padding:0;display:flex;align-items:center;justify-content:center;gap:2px;font-size:14px}.tooltoggle.active{background:#506f8d;color:#fff}.toolpanel{position:absolute;top:34px;left:0;width:126px;padding:5px;background:#fff;border:1px solid rgba(20,30,22,.18);border-radius:8px;box-shadow:0 7px 20px rgba(0,0,0,.18);display:none;z-index:1300}.toolpanel.open{display:block}.toolitem{width:100%;height:34px;border:0;border-radius:6px;background:#fff;text-align:left;padding:0 8px;font-size:12px;font-weight:700}.titletext{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.headercontrols{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}.searchbox{display:flex;align-items:center;height:28px;width:138px;background:#fff;border:1px solid rgba(20,30,22,.18);border-radius:8px;overflow:hidden}.searchbox input{border:0;outline:0;background:transparent;padding:0 6px;width:100%;height:100%;font-size:11px;min-width:0}.searchbox button,.locate{border:0;background:#fff;height:100%;width:28px;font-size:14px;color:#172019}.locate{height:28px;border:1px solid rgba(20,30,22,.18);border-radius:8px}.mapwrap{position:relative;min-height:0}#map{position:absolute;inset:0;background:#d7d7d7}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.78)!important}
.palette{position:absolute;inset:0;z-index:1400;background:#fff;color:#111;display:none;overflow:auto}.palette.open{display:block}.palettehead{height:56px;background:#5b5b5b;color:#fff;display:grid;grid-template-columns:56px 1fr 56px;align-items:center}.palettehead button{height:56px;border:0;background:transparent;color:#fff;font-size:26px}.palettehead strong{text-align:center;font-size:18px;font-weight:500}.palettebody{max-width:620px;margin:auto;padding:28px 22px 40px}.pens{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;background:#f0f0f2;border-radius:12px;padding:4px;margin-bottom:18px}.pens button{height:48px;border:0;border-radius:9px;background:transparent;font-size:24px}.pens button.on{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14)}.controlrow{display:grid;grid-template-columns:1fr 44px;align-items:center;gap:12px;margin:14px 0}.controlrow input[type=range]{width:100%}.swatches{display:flex;justify-content:space-between;gap:9px;margin:22px 0}.swatch{width:44px;height:44px;border-radius:50%;border:2px solid transparent;padding:0;flex:0 0 auto}.swatch.on{border-color:#111;box-shadow:0 0 0 3px #fff inset}.colourfield{height:285px;border:1px solid #ddd;background:linear-gradient(to bottom,rgba(255,255,255,0),rgba(80,80,80,.9)),linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);position:relative;touch-action:none}.colourcursor{position:absolute;width:32px;height:32px;border:3px solid #111;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;background:transparent}.colourmeta{display:flex;justify-content:space-between;align-items:center;margin:12px 0 4px;color:#555;font-size:18px}.hex{color:#31518a}.quickbar{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:1350;background:rgba(74,74,74,.95);border-radius:12px;display:none;align-items:center;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.25)}.quickbar.open{display:flex}.quickbar button{height:42px;min-width:46px;border:0;border-right:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;font-size:20px}.quickbar button.on{background:#506f8d}.quickbar .colourchip{width:26px;height:26px;border-radius:50%;margin:0 10px;border:2px solid #fff}.drawhint{position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1340;background:rgba(35,35,35,.8);color:#fff;padding:6px 10px;border-radius:999px;font-size:11px;display:none}.drawhint.open{display:block}
@media(max-width:430px){.swatch{width:38px;height:38px}.palettebody{padding:24px 18px}.colourfield{height:250px}.pens button{height:44px}.searchbox{width:128px}}
</style>
</head>
<body>
<div class="page">
<header class="titlebar">
<div class="toolmenu"><button id="toolToggle" class="tooltoggle" aria-label="Open tools">✎ ▾</button><div id="toolPanel" class="toolpanel"><button id="drawingItem" class="toolitem">✎ Drawing</button></div></div>
<div class="titletext">THUMPASSERY AGRO&nbsp; - &nbsp;Location Map</div>
<div class="headercontrols"><div class="searchbox"><input id="placeSearch" type="search" placeholder="Search place"><button id="searchBtn">⌕</button></div><button id="locateBtn" class="locate">◎</button></div>
</header>
<main class="mapwrap"><div id="map"></div><div id="drawHint" class="drawhint">Draw on the map · use two fingers to zoom</div><div id="quickbar" class="quickbar"><button id="paletteBtn">🎨</button><button id="undoBtn">↶</button><button id="redoBtn">↷</button><button id="eraserBtn">⌫</button><span id="quickColour" class="colourchip"></span><button id="exitDrawBtn">✓</button></div></main>
</div>
<section id="palette" class="palette" aria-hidden="true"><div class="palettehead"><button id="paletteDone">☑</button><strong>Palette</strong><span></span></div><div class="palettebody">
<div class="pens" id="pens"><button data-tip="marker">▬</button><button class="on" data-tip="round">╱</button><button data-tip="fine">╱</button><button data-tip="pencil">╱</button><button data-tip="chisel">▰</button><button data-tip="eraser">⌫</button></div>
<div class="controlrow"><input id="widthRange" type="range" min="1" max="24" value="4"><b id="widthValue">4</b></div>
<div class="swatches" id="swatches"><button class="swatch" data-colour="#5b260d" style="background:#5b260d"></button><button class="swatch" data-colour="#ef31b3" style="background:#ef31b3"></button><button class="swatch" data-colour="#eee318" style="background:#eee318"></button><button class="swatch" data-colour="#040a0b" style="background:#040a0b"></button><button class="swatch" data-colour="#4c850b" style="background:#4c850b"></button><button class="swatch" data-colour="#2d292b" style="background:#2d292b"></button><button class="swatch" data-colour="#1e90c5" style="background:#1e90c5"></button></div>
<div id="colourField" class="colourfield"><div id="colourCursor" class="colourcursor" style="left:54%;top:35%"></div></div>
<div class="colourmeta"><span id="alphaText">α: 100%</span><span id="hexText" class="hex">#040A0B</span></div>
<input id="alphaRange" type="range" min="10" max="100" value="100" style="width:100%">
</div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false,doubleClickZoom:true,maxZoom:23,minZoom:3,worldCopyJump:true}).setView([9.015,76.925],17);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:23,attribution:'Esri, Maxar, Earthstar Geographics, and the GIS User Community'}).addTo(map);
const $=s=>document.querySelector(s),toolToggle=$('#toolToggle'),toolPanel=$('#toolPanel'),palette=$('#palette'),quickbar=$('#quickbar'),drawHint=$('#drawHint');
let drawingMode=false, erasing=false, drawing=false, current=null, strokes=[], redoStack=[], colour='#040A0B', opacity=1, width=4, tip='round', locationMarker=null;
function rgba(hex,a){const n=parseInt(hex.slice(1),16);return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`}
function setDrawMode(on){drawingMode=on;toolToggle.classList.toggle('active',on);quickbar.classList.toggle('open',on);drawHint.classList.toggle('open',on);if(!on){erasing=false;$('#eraserBtn').classList.remove('on')} map.dragging[on?'disable':'enable']();}
function openPalette(){palette.classList.add('open');palette.setAttribute('aria-hidden','false')}
function closePalette(){palette.classList.remove('open');palette.setAttribute('aria-hidden','true');setDrawMode(true)}
toolToggle.onclick=e=>{e.stopPropagation();toolPanel.classList.toggle('open')};
$('#drawingItem').onclick=()=>{toolPanel.classList.remove('open');setDrawMode(true);openPalette()};document.addEventListener('click',()=>toolPanel.classList.remove('open'));toolPanel.onclick=e=>e.stopPropagation();
$('#paletteBtn').onclick=openPalette;$('#paletteDone').onclick=closePalette;$('#exitDrawBtn').onclick=()=>setDrawMode(false);
$('#widthRange').oninput=e=>{width=+e.target.value;$('#widthValue').textContent=width};$('#alphaRange').oninput=e=>{opacity=+e.target.value/100;$('#alphaText').textContent='α: '+e.target.value+'%'};
function chooseColour(c){colour=c.toUpperCase();$('#hexText').textContent=colour;$('#quickColour').style.background=colour;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('on',x.dataset.colour.toUpperCase()===colour))}
chooseColour(colour);
$('#swatches').onclick=e=>{const b=e.target.closest('.swatch');if(b)chooseColour(b.dataset.colour)};
$('#pens').onclick=e=>{const b=e.target.closest('button');if(!b)return;tip=b.dataset.tip;document.querySelectorAll('#pens button').forEach(x=>x.classList.remove('on'));b.classList.add('on');erasing=tip==='eraser';if(tip==='marker')width=Math.max(width,12);if(tip==='fine')width=2;if(tip==='pencil')width=3;if(tip==='chisel')width=8;$('#widthRange').value=width;$('#widthValue').textContent=width;$('#eraserBtn').classList.toggle('on',erasing)};
function setColourFromField(ev){const r=$('#colourField').getBoundingClientRect();const x=Math.max(0,Math.min(r.width,ev.clientX-r.left)),y=Math.max(0,Math.min(r.height,ev.clientY-r.top));const h=x/r.width*360,s=88,l=62-(y/r.height*48);const c=hslToHex(h,s,l);chooseColour(c);$('#colourCursor').style.left=x+'px';$('#colourCursor').style.top=y+'px'}
function hslToHex(h,s,l){s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return '#'+[f(0),f(8),f(4)].map(x=>Math.round(255*x).toString(16).padStart(2,'0')).join('').toUpperCase()}
let colourPicking=false;$('#colourField').addEventListener('pointerdown',e=>{colourPicking=true;$('#colourField').setPointerCapture(e.pointerId);setColourFromField(e)});$('#colourField').addEventListener('pointermove',e=>{if(colourPicking)setColourFromField(e)});$('#colourField').addEventListener('pointerup',()=>colourPicking=false);
function strokeStyle(){let w=width,dash=null;if(tip==='marker')w=Math.max(12,width);if(tip==='fine')w=Math.max(1,Math.min(width,3));if(tip==='pencil')dash='1 2';return{color:rgba(colour,opacity),weight:w,opacity:1,lineCap:tip==='chisel'?'butt':'round',lineJoin:'round',dashArray:dash,interactive:true}}
const container=map.getContainer();
function pointLatLng(ev){const r=container.getBoundingClientRect();return map.containerPointToLatLng(L.point(ev.clientX-r.left,ev.clientY-r.top))}
container.addEventListener('pointerdown',e=>{if(!drawingMode||palette.classList.contains('open')||e.pointerType==='touch'&&e.isPrimary===false)return;if(erasing)return;drawing=true;redoStack=[];container.setPointerCapture(e.pointerId);current=L.polyline([pointLatLng(e)],strokeStyle()).addTo(map);current._tag='drawStroke';current.on('click',()=>{if(erasing){removeStroke(current)}});e.preventDefault()});
container.addEventListener('pointermove',e=>{if(!drawing||!current)return;current.addLatLng(pointLatLng(e));e.preventDefault()});
container.addEventListener('pointerup',e=>{if(!drawing||!current)return;drawing=false;strokes.push(current);current=null;e.preventDefault()});
function removeStroke(layer){const i=strokes.indexOf(layer);if(i>=0){strokes.splice(i,1);map.removeLayer(layer);redoStack=[]}}
$('#eraserBtn').onclick=()=>{erasing=!erasing;$('#eraserBtn').classList.toggle('on',erasing)};
$('#undoBtn').onclick=()=>{const l=strokes.pop();if(l){map.removeLayer(l);redoStack.push(l)}};$('#redoBtn').onclick=()=>{const l=redoStack.pop();if(l){l.addTo(map);strokes.push(l)}};
map.on('click',e=>{if(!drawingMode||!erasing)return;let best=null,dist=18;strokes.forEach(l=>{const pts=l.getLatLngs();for(const p of pts){const d=map.latLngToContainerPoint(p).distanceTo(map.latLngToContainerPoint(e.latlng));if(d<dist){dist=d;best=l}}});if(best)removeStroke(best)});
async function searchPlace(){const q=$('#placeSearch').value.trim();if(!q)return;const direct=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(direct){map.setView([+direct[1],+direct[2]],19);return}try{const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const data=await res.json();if(data[0])map.setView([+data[0].lat,+data[0].lon],19)}catch{}}
$('#searchBtn').onclick=searchPlace;$('#placeSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace()});$('#locateBtn').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,19);if(locationMarker)locationMarker.setLatLng(ll);else locationMarker=L.circleMarker(ll,{radius:6,weight:2,color:'#fff',fillColor:'#1677ff',fillOpacity:1,interactive:false}).addTo(map)},()=>{},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
</script>
</body>
</html>
