<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>THUMPASSERY AGRO - Location Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}button,input{font:inherit}.page{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr}.titlebar{display:flex;align-items:center;gap:6px;padding:0 6px;background:#fff;border-bottom:1px solid #d9ded9;color:#172019;z-index:1000;position:relative}.toolmenu{position:relative;flex:0 0 auto}.tooltoggle{height:28px;width:34px;border:1px solid rgba(20,30,22,.18);border-radius:7px;background:#fff;color:#172019;padding:0;display:flex;align-items:center;justify-content:center;gap:2px;font-size:14px}.toolpanel{position:absolute;top:34px;left:0;width:126px;padding:5px;background:#fff;border:1px solid rgba(20,30,22,.18);border-radius:8px;box-shadow:0 7px 20px rgba(0,0,0,.18);display:none;z-index:1300}.toolpanel.open{display:block}.toolitem{width:100%;height:34px;border:0;border-radius:6px;background:#fff;text-align:left;padding:0 8px;font-size:12px;font-weight:700}.titletext{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.headercontrols{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}.searchbox{display:flex;align-items:center;height:28px;width:138px;background:#fff;border:1px solid rgba(20,30,22,.18);border-radius:8px;overflow:hidden}.searchbox input{border:0;outline:0;background:transparent;padding:0 6px;width:100%;height:100%;font-size:11px;min-width:0}.searchbox button,.locate{border:0;background:#fff;height:100%;width:28px;font-size:14px;color:#172019}.locate{height:28px;border:1px solid rgba(20,30,22,.18);border-radius:8px}.mapwrap{position:relative;min-height:0}#map{position:absolute;inset:0;background:#d7d7d7}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.78)!important}
.palette{position:absolute;inset:0;z-index:1400;background:#fff;color:#111;display:none;overflow:auto}.palette.open{display:block}.palettehead{height:56px;background:#5b5b5b;color:#fff;display:grid;grid-template-columns:56px 1fr 56px;align-items:center}.palettehead button{height:56px;border:0;background:transparent;color:#fff;font-size:26px}.palettehead strong{text-align:center;font-size:18px;font-weight:500}.palettebody{max-width:720px;margin:auto;padding:24px 16px 36px}.toolrow{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;background:#f0f0f2;border-radius:12px;padding:5px}.irrigtool{border:0;background:transparent;border-radius:9px;min-width:0;padding:7px 2px 8px;color:#111}.irrigtool.on{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14)}.toolicon{height:38px;display:flex;align-items:center;justify-content:center}.sample{display:block;background:#178be8;border-radius:2px}.boundarySample{width:30px;height:4px;border:2px dashed #178be8;background:transparent;border-radius:50%}.mainSample{width:34px;height:6px}.submainSample{width:32px;height:4px}.lateralSample{width:30px;height:2px}.emitterSample{width:18px;height:12px;transform:skew(-22deg)}.tapSample{font-size:26px;color:#178be8}.toolname{display:block;margin-top:5px;font-size:11px;white-space:nowrap}.config{margin-top:20px;border:1px solid #e3e3e3;border-radius:12px;min-height:210px;padding:16px;background:#fafafa}.config h3{margin:0 0 14px;font-size:16px}.choices{display:flex;flex-wrap:wrap;gap:8px}.choice{border:1px solid #c9c9c9;background:#fff;border-radius:9px;padding:9px 12px;font-size:13px}.choice.on{border-color:#178be8;background:#eaf5ff;color:#075d9e;font-weight:700}.materialRow{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px;font-size:13px}.materialRow label{display:flex;align-items:center;gap:6px}.placeholderGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.placeholder{height:64px;border:1px dashed #b8b8b8;border-radius:10px;display:grid;place-items:center;color:#888;font-size:11px}.helper{font-size:12px;color:#666;margin-top:14px}.activeToolTag{position:absolute;left:10px;bottom:10px;z-index:1300;background:rgba(255,255,255,.9);padding:6px 9px;border-radius:8px;font-size:11px;font-weight:700;display:none}.activeToolTag.show{display:block}
@media(max-width:430px){.palettebody{padding:22px 10px}.toolname{font-size:9px}.toolrow{gap:2px}.config{padding:13px}.searchbox{width:128px}.placeholderGrid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<div class="page">
<header class="titlebar">
<div class="toolmenu"><button id="toolToggle" class="tooltoggle" aria-label="Open tools">✎ ▾</button><div id="toolPanel" class="toolpanel"><button id="drawingItem" class="toolitem">✎ Drawing</button></div></div>
<div class="titletext">THUMPASSERY AGRO&nbsp; - &nbsp;Location Map</div>
<div class="headercontrols"><div class="searchbox"><input id="placeSearch" type="search" placeholder="Search place"><button id="searchBtn">⌕</button></div><button id="locateBtn" class="locate">◎</button></div>
</header>
<main class="mapwrap"><div id="map"></div><div id="activeToolTag" class="activeToolTag"></div></main>
</div>
<section id="palette" class="palette" aria-hidden="true">
<div class="palettehead"><button id="paletteDone">☑</button><strong>Palette</strong><span></span></div>
<div class="palettebody">
<div id="toolRow" class="toolrow">
<button class="irrigtool on" data-tool="boundary"><span class="toolicon"><span class="boundarySample"></span></span><span class="toolname">Boundary</span></button>
<button class="irrigtool" data-tool="main"><span class="toolicon"><span class="sample mainSample"></span></span><span class="toolname">Main</span></button>
<button class="irrigtool" data-tool="submain"><span class="toolicon"><span class="sample submainSample"></span></span><span class="toolname">Submain</span></button>
<button class="irrigtool" data-tool="lateral"><span class="toolicon"><span class="sample lateralSample"></span></span><span class="toolname">Lateral</span></button>
<button class="irrigtool" data-tool="emitter"><span class="toolicon"><span class="sample emitterSample"></span></span><span class="toolname">Emitter</span></button>
<button class="irrigtool" data-tool="fittings"><span class="toolicon tapSample">⌫</span><span class="toolname">Fittings</span></button>
</div>
<div id="config" class="config"></div>
</div>
</section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false,doubleClickZoom:true,maxZoom:23,minZoom:3,worldCopyJump:true}).setView([9.015,76.925],17);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:23,attribution:'Esri, Maxar, Earthstar Geographics, and the GIS User Community'}).addTo(map);
const $=s=>document.querySelector(s),toolToggle=$('#toolToggle'),toolPanel=$('#toolPanel'),palette=$('#palette'),config=$('#config'),tag=$('#activeToolTag');
let activeTool='boundary',drawing=false,current=null,startLatLng=null,startPoint=null,locationMarker=null;
const state={main:{size:50,material:'PVC'},submain:{size:40,material:'PVC'},lateral:{size:16,material:'LLDPE'}};
const styles={boundary:{color:'#ffd400',weight:2.5,dashArray:'8 6',lineCap:'round'},main:{color:'#0b63ce',weight:6,lineCap:'round'},submain:{color:'#1683d8',weight:4,lineCap:'round'},lateral:{color:'#3ba5e8',weight:2.5,lineCap:'round'}};
function normalizeWorkingZoom(){const z=map.getZoom();if(z<18)map.setZoom(18,{animate:false});else if(z>21)map.setZoom(21,{animate:false})}
function openPalette(){palette.classList.add('open');palette.setAttribute('aria-hidden','false');renderConfig()}
function closePalette(){palette.classList.remove('open');palette.setAttribute('aria-hidden','true');if(['boundary','main','submain','lateral'].includes(activeTool))normalizeWorkingZoom();setTag()}
toolToggle.onclick=e=>{e.stopPropagation();toolPanel.classList.toggle('open')};
$('#drawingItem').onclick=()=>{toolPanel.classList.remove('open');openPalette()};
document.addEventListener('click',()=>toolPanel.classList.remove('open'));toolPanel.onclick=e=>e.stopPropagation();$('#paletteDone').onclick=closePalette;
function selectTool(tool){activeTool=tool;document.querySelectorAll('.irrigtool').forEach(b=>b.classList.toggle('on',b.dataset.tool===tool));renderConfig()}
$('#toolRow').onclick=e=>{const b=e.target.closest('.irrigtool');if(b)selectTool(b.dataset.tool)};
function sizeButtons(tool,sizes){return `<div class="choices">${sizes.map(s=>`<button class="choice ${state[tool].size===s?'on':''}" data-size="${s}">${s} mm</button>`).join('')}</div>`}
function materialRadios(tool,items){return `<div class="materialRow">${items.map(x=>`<label><input type="radio" name="${tool}Material" value="${x}" ${state[tool].material===x?'checked':''}> ${x}</label>`).join('')}</div>`}
function renderConfig(){
 if(activeTool==='boundary'){config.innerHTML='<h3>Boundary</h3><div class="helper">Draw the field boundary on the map. Pipe options are not shown for this tool.</div>';return}
 if(activeTool==='main'){config.innerHTML='<h3>Main pipe</h3>'+sizeButtons('main',[25,32,40,50,63,75,90])+materialRadios('main',['PVC','HDPE','Oval Hose'])+'<div class="helper">PVC is the default.</div>';wireConfig('main');return}
 if(activeTool==='submain'){config.innerHTML='<h3>Submain pipe</h3>'+sizeButtons('submain',[25,32,40,50,63,75,90])+materialRadios('submain',['PVC','HDPE','Oval Hose'])+'<div class="helper">PVC is the default.</div>';wireConfig('submain');return}
 if(activeTool==='lateral'){config.innerHTML='<h3>Lateral</h3>'+sizeButtons('lateral',[12,16,20])+'<div class="materialRow"><label><input type="radio" checked disabled> LLDPE</label></div>';wireConfig('lateral');return}
 if(activeTool==='emitter'){config.innerHTML='<h3>Emitter</h3><div class="helper">Emitter tool is ready. Emitter choices will be added after the pipe tools are accepted.</div>';return}
 if(activeTool==='fittings'){config.innerHTML='<h3>Fittings</h3><div class="placeholderGrid"><div class="placeholder">Fitting</div><div class="placeholder">Fitting</div><div class="placeholder">Fitting</div><div class="placeholder">Fitting</div><div class="placeholder">Fitting</div><div class="placeholder">Fitting</div></div><div class="helper">Image slots only for now. Fitting images will be inserted later.</div>';return}
}
function wireConfig(tool){config.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{state[tool].size=+b.dataset.size;renderConfig()});config.querySelectorAll(`input[name="${tool}Material"]`).forEach(r=>r.onchange=()=>{state[tool].material=r.value})}
function setTag(){if(['boundary','main','submain','lateral','emitter'].includes(activeTool)){let text=activeTool[0].toUpperCase()+activeTool.slice(1);if(state[activeTool])text+=` · ${state[activeTool].size} mm · ${state[activeTool].material}`;tag.textContent=text;tag.classList.add('show')}else tag.classList.remove('show')}
renderConfig();
const container=map.getContainer();
function pointLatLng(ev){const r=container.getBoundingClientRect();return map.containerPointToLatLng(L.point(ev.clientX-r.left,ev.clientY-r.top))}
function pointPx(ev){const r=container.getBoundingClientRect();return L.point(ev.clientX-r.left,ev.clientY-r.top)}
function finishSegment(ev){if(!drawing)return;const end=pointLatLng(ev),endPoint=pointPx(ev);drawing=false;map.dragging.enable();if(current){if(startPoint.distanceTo(endPoint)<8){map.removeLayer(current)}else current.setLatLngs([startLatLng,end]);current=null}startLatLng=null;startPoint=null;ePrevent(ev)}
function ePrevent(ev){if(ev&&ev.cancelable)ev.preventDefault()}
container.addEventListener('pointerdown',e=>{if(palette.classList.contains('open'))return;if(!['boundary','main','submain','lateral'].includes(activeTool))return;if(e.pointerType==='touch'&&e.isPrimary===false)return;normalizeWorkingZoom();drawing=true;map.dragging.disable();container.setPointerCapture(e.pointerId);startLatLng=pointLatLng(e);startPoint=pointPx(e);current=L.polyline([startLatLng,startLatLng],styles[activeTool]).addTo(map);ePrevent(e)});
container.addEventListener('pointermove',e=>{if(!drawing||!current)return;current.setLatLngs([startLatLng,pointLatLng(e)]);ePrevent(e)});
container.addEventListener('pointerup',finishSegment);
container.addEventListener('pointercancel',e=>{if(current)map.removeLayer(current);drawing=false;current=null;startLatLng=null;startPoint=null;map.dragging.enable();ePrevent(e)});
map.on('click',e=>{if(palette.classList.contains('open')||activeTool!=='emitter')return;L.circleMarker(e.latlng,{radius:5,color:'#178be8',weight:2,fillColor:'#fff',fillOpacity:1}).addTo(map)});
async function searchPlace(){const q=$('#placeSearch').value.trim();if(!q)return;const direct=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(direct){map.setView([+direct[1],+direct[2]],19);return}try{const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const data=await res.json();if(data[0])map.setView([+data[0].lat,+data[0].lon],19)}catch(e){}}
$('#searchBtn').onclick=searchPlace;$('#placeSearch').onkeydown=e=>{if(e.key==='Enter')searchPlace()};
$('#locateBtn').onclick=()=>{if(!navigator.geolocation)return;navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,19);if(locationMarker)locationMarker.setLatLng(ll);else locationMarker=L.circleMarker(ll,{radius:6,weight:2,color:'#fff',fillColor:'#1677ff',fillOpacity:1,interactive:false}).addTo(map)},()=>{},{enableHighAccuracy:true,timeout:12000,maximumAge:30000})};
</script>
</body>
</html>
