<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <title>THUMPASSERY AGRO - Location Map</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}
    .page{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr}
    .titlebar{display:flex;align-items:center;padding:0 12px;background:#fff;border-bottom:1px solid #d9ded9;font-size:13px;font-weight:800;letter-spacing:.01em;color:#172019;z-index:1000}
    .mapwrap{position:relative;min-height:0}
    #map{position:absolute;inset:0;background:#d7d7d7}
    .topright{position:absolute;z-index:1001;top:10px;right:10px;display:flex;align-items:center;gap:6px;max-width:calc(100% - 20px)}
    .searchbox{display:flex;align-items:center;height:40px;background:rgba(255,255,255,.97);border:1px solid rgba(20,30,22,.18);border-radius:12px;box-shadow:0 3px 14px rgba(0,0,0,.16);overflow:hidden;min-width:0;width:min(320px,calc(100vw - 78px))}
    .searchbox input{border:0;outline:0;background:transparent;padding:0 11px;width:100%;height:100%;font:inherit;font-size:14px;color:#172019;min-width:0}
    .searchbox button,.locate{border:0;background:transparent;height:100%;width:42px;font-size:18px;cursor:pointer;color:#172019}
    .locate{height:40px;width:40px;border-radius:12px;background:rgba(255,255,255,.97);border:1px solid rgba(20,30,22,.18);box-shadow:0 3px 14px rgba(0,0,0,.16);font-weight:800}
    .leaflet-control-zoom{display:none}
    .leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.78)!important}
    .leaflet-marker-icon.location-dot{filter:none}
    @media(max-width:520px){.titlebar{font-size:12px;padding:0 10px}.topright{top:8px;right:8px}.searchbox{width:calc(100vw - 66px)}}
  </style>
</head>
<body>
<div class="page">
  <header class="titlebar">THUMPASSERY AGRO&nbsp; - &nbsp;Location Map</header>
  <main class="mapwrap">
    <div id="map"></div>
    <div class="topright">
      <div class="searchbox">
        <input id="placeSearch" type="search" inputmode="search" autocomplete="off" placeholder="Search place" aria-label="Search place">
        <button id="searchBtn" aria-label="Search">⌕</button>
      </div>
      <button id="locateBtn" class="locate" aria-label="Use my location">◎</button>
    </div>
  </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
  const map=L.map('map',{zoomControl:false,doubleClickZoom:true,maxZoom:23,minZoom:3,worldCopyJump:true}).setView([9.015,76.925],17);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{
    maxNativeZoom:18,
    maxZoom:23,
    attribution:'Esri, Maxar, Earthstar Geographics, and the GIS User Community'
  }).addTo(map);

  let locationMarker=null;

  async function searchPlace(){
    const q=document.getElementById('placeSearch').value.trim();
    if(!q)return;
    const direct=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);
    if(direct){
      map.setView([Number(direct[1]),Number(direct[2])],19);
      return;
    }
    try{
      const res=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q),{headers:{'Accept':'application/json'}});
      const data=await res.json();
      if(data[0]) map.setView([Number(data[0].lat),Number(data[0].lon)],19);
    }catch(e){}
  }

  document.getElementById('searchBtn').addEventListener('click',searchPlace);
  document.getElementById('placeSearch').addEventListener('keydown',e=>{if(e.key==='Enter')searchPlace();});

  document.getElementById('locateBtn').addEventListener('click',()=>{
    if(!navigator.geolocation)return;
    navigator.geolocation.getCurrentPosition(p=>{
      const ll=[p.coords.latitude,p.coords.longitude];
      map.setView(ll,19);
      if(locationMarker) locationMarker.setLatLng(ll);
      else locationMarker=L.circleMarker(ll,{radius:6,weight:2,color:'#fff',fillColor:'#1677ff',fillOpacity:1,interactive:false}).addTo(map);
    },()=>{}, {enableHighAccuracy:true,timeout:12000,maximumAge:30000});
  });
</script>
</body>
</html>
