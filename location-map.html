<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>THUMPASSERY AGRO - Location Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#111}button,input{font:inherit}.page{position:fixed;inset:0;display:grid;grid-template-rows:42px 1fr}.titlebar{display:flex;align-items:center;gap:6px;padding:0 6px;background:#fff;border-bottom:1px solid #d9ded9;color:#172019;z-index:1000;position:relative}.toolmenu{position:relative;flex:0 0 auto}.tooltoggle{height:28px;width:34px;border:1px solid rgba(20,30,22,.18);border-radius:7px;background:#fff;color:#172019;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px}.toolpanel{position:absolute;top:34px;left:0;width:126px;padding:5px;background:#fff;border:1px solid rgba(20,30,22,.18);border-radius:8px;box-shadow:0 7px 20px rgba(0,0,0,.18);display:none;z-index:1500}.toolpanel.open{display:block}.toolitem{width:100%;height:34px;border:0;border-radius:6px;background:#fff;text-align:left;padding:0 8px;font-size:12px;font-weight:700}.titletext{font-size:10.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}.headercontrols{margin-left:auto;display:flex;align-items:center;gap:5px;flex:0 0 auto}.searchbox{display:flex;align-items:center;height:28px;width:128px;background:#fff;border:1px solid rgba(20,30,22,.18);border-radius:8px;overflow:hidden}.searchbox input{border:0;outline:0;background:transparent;padding:0 6px;width:100%;height:100%;font-size:11px;min-width:0}.searchbox button,.locate{border:0;background:#fff;height:100%;width:28px;font-size:14px;color:#172019}.locate{height:28px;border:1px solid rgba(20,30,22,.18);border-radius:8px}.mapwrap{position:relative;min-height:0}#map{position:absolute;inset:0;background:#d7d7d7}.leaflet-control-zoom{display:none}.leaflet-control-attribution{font-size:8px!important;background:rgba(255,255,255,.78)!important}
.palette{position:absolute;inset:0;z-index:1600;background:#fff;color:#111;display:none;overflow:auto}.palette.open{display:block}.palettehead{height:54px;background:#5b5b5b;color:#fff;display:grid;grid-template-columns:54px 1fr 54px;align-items:center}.palettehead button{height:54px;border:0;background:transparent;color:#fff;font-size:25px}.palettehead strong{text-align:center;font-size:18px;font-weight:500}.palettebody{max-width:720px;margin:auto;padding:22px 12px 34px}.toolrow{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;background:#f0f0f2;border-radius:12px;padding:5px}.irrigtool{border:0;background:transparent;border-radius:9px;min-width:0;padding:7px 1px 8px}.irrigtool.on{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.14)}.toolicon{height:34px;display:flex;align-items:center;justify-content:center}.sample{display:block;background:#178be8;border-radius:2px}.boundarySample{width:28px;height:22px;border:2px dashed #178be8;background:transparent;border-radius:7px}.mainSample{width:34px;height:6px}.submainSample{width:32px;height:4px}.lateralSample{width:30px;height:2px}.emitterSample{width:16px;height:11px;transform:skew(-22deg)}.tapSample{font-size:24px;color:#178be8}.toolname{display:block;margin-top:4px;font-size:9px;white-space:nowrap}.config{margin-top:18px;border:1px solid #e3e3e3;border-radius:12px;min-height:190px;padding:14px;background:#fafafa}.config h3{margin:0 0 12px;font-size:16px}.choices{display:flex;flex-wrap:wrap;gap:7px}.choice{border:1px solid #c9c9c9;background:#fff;border-radius:8px;padding:8px 11px;font-size:13px}.choice.on{border-color:#178be8;background:#eaf5ff;color:#075d9e;font-weight:700}.materialRow{display:flex;flex-wrap:wrap;gap:14px;margin-top:16px;font-size:13px}.materialRow label{display:flex;align-items:center;gap:5px}.helper{font-size:12px;color:#666;margin-top:13px}.placeholderGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.placeholder{height:58px;border:1px dashed #b8b8b8;border-radius:9px;display:grid;place-items:center;color:#888;font-size:11px}.activebar{position:absolute;right:9px;top:9px;z-index:1400;display:none;align-items:center;background:rgba(255,255,255,.96);border:1px solid rgba(20,30,22,.2);border-radius:9px;box-shadow:0 3px 12px rgba(0,0,0,.16);overflow:hidden}.activebar.show{display:flex}.activebar button{height:34px;border:0;border-left:1px solid #ddd;background:#fff;padding:0 9px;font-size:12px}.activebar .toolnamebar{font-size:12px;font-weight:800;padding:0 9px;white-space:nowrap}.activebar .finish{font-size:18px}.activebar .cancel{font-size:16px}.vertex-icon{width:18px!important;height:18px!important;margin-left:-9px!important;margin-top:-9px!important;border-radius:50%;border:3px solid #fff;background:#156fd1;box-shadow:0 0 0 1px rgba(0,0,0,.65),0 2px 6px rgba(0,0,0,.25)}.vertex-icon.connection{background:#ff9f0a}.vertex-icon.draft{background:#111}@media(max-width:390px){.searchbox{width:112px}.titletext{font-size:9.5px}.activebar .toolnamebar{max-width:115px;overflow:hidden;text-overflow:ellipsis}.activebar button{padding:0 7px}}
</style>
</head>
<body>
<div class="page"><header class="titlebar"><div class="toolmenu"><button id="toolToggle" class="tooltoggle">✎ ▾</button><div id="toolPanel" class="toolpanel"><button id="drawingItem" class="toolitem">✎ Drawing</button></div></div><div class="titletext">THUMPASSERY AGRO&nbsp; - &nbsp;Location Map</div><div class="headercontrols"><div class="searchbox"><input id="placeSearch" type="search" placeholder="Search place"><button id="searchBtn">⌕</button></div><button id="locateBtn" class="locate">◎</button></div></header><main class="mapwrap"><div id="map"></div><div id="activeBar" class="activebar"><span id="toolNameBar" class="toolnamebar"></span><button id="optionsBtn">Options ▾</button><button id="finishBtn" class="finish">✓</button><button id="cancelBtn" class="cancel">×</button></div></main></div>
<section id="palette" class="palette" aria-hidden="true"><div class="palettehead"><button id="paletteDone">☑</button><strong>Palette</strong><span></span></div><div class="palettebody"><div id="toolRow" class="toolrow"><button class="irrigtool on" data-tool="boundary"><span class="toolicon"><span class="boundarySample"></span></span><span class="toolname">Boundary</span></button><button class="irrigtool" data-tool="main"><span class="toolicon"><span class="sample mainSample"></span></span><span class="toolname">Main</span></button><button class="irrigtool" data-tool="submain"><span class="toolicon"><span class="sample submainSample"></span></span><span class="toolname">Submain</span></button><button class="irrigtool" data-tool="lateral"><span class="toolicon"><span class="sample lateralSample"></span></span><span class="toolname">Lateral</span></button><button class="irrigtool" data-tool="emitter"><span class="toolicon"><span class="sample emitterSample"></span></span><span class="toolname">Emitter</span></button><button class="irrigtool" data-tool="fittings"><span class="toolicon tapSample">⌫</span><span class="toolname">Fittings</span></button></div><div id="config" class="config"></div></div></section>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map',{zoomControl:false,doubleClickZoom:true,maxZoom:23,minZoom:3,worldCopyJump:true}).setView([9.015,76.925],17);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxNativeZoom:18,maxZoom:23,attribution:'Esri, Maxar, Earthstar Geographics, and the GIS User Community'}).addTo(map);
const $=s=>document.querySelector(s),toolToggle=$('#toolToggle'),toolPanel=$('#toolPanel'),palette=$('#palette'),config=$('#config'),activeBar=$('#activeBar'),toolNameBar=$('#toolNameBar');const styles={boundary:{color:'#ffd400',weight:2.5,dashArray:'8 6',fillColor:'#ffd400',fillOpacity:.05},main:{color:'#0b63ce',weight:6},submain:{color:'#1683d8',weight:4},lateral:{color:'#3ba5e8',weight:2.5}};const state={main:{size:50,material:'PVC',connect:false},submain:{size:40,material:'PVC',connect:true},lateral:{size:16,material:'LLDPE',connect:true}};let activeTool='boundary',draft=null,selected=null,objects=[],vertexMarkers=[],locationMarker=null,seq=0;const icon=(connection=false,draft=false)=>L.divIcon({className:'',html:`<div class="vertex-icon ${connection?'connection':''} ${draft?'draft':''}"></div>`,iconSize:[18,18],iconAnchor:[9,9]});
function titleFor(t){return t==='boundary'?'Boundary':t[0].toUpperCase()+t.slice(1)+(state[t]?` · ${state[t].size} mm · ${state[t].material}`:'')}function openPalette(){palette.classList.add('open');renderConfig()}function closePalette(){palette.classList.remove('open');beginDraft(activeTool)}toolToggle.onclick=e=>{e.stopPropagation();toolPanel.classList.toggle('open')};document.addEventListener('click',()=>toolPanel.classList.remove('open'));toolPanel.onclick=e=>e.stopPropagation();$('#drawingItem').onclick=()=>{toolPanel.classList.remove('open');openPalette()};$('#paletteDone').onclick=closePalette;$('#optionsBtn').onclick=openPalette;function selectTool(t){activeTool=t;document.querySelectorAll('.irrigtool').forEach(b=>b.classList.toggle('on',b.dataset.tool===t));renderConfig()}$('#toolRow').onclick=e=>{const b=e.target.closest('.irrigtool');if(b)selectTool(b.dataset.tool)};
function sizeButtons(t,a){return `<div class="choices">${a.map(s=>`<button class="choice ${state[t].size===s?'on':''}" data-size="${s}">${s}</button>`).join('')}</div>`}function mats(t,a){return `<div class="materialRow">${a.map(x=>`<label><input type="radio" name="${t}Material" value="${x}" ${state[t].material===x?'checked':''}> ${x}</label>`).join('')}</div>`}function connectRow(t){return `<div class="materialRow"><label><input id="connectCheck" type="checkbox" ${state[t].connect?'checked':''}> Connect start to existing pipe</label></div>`}
function renderConfig(){if(activeTool==='boundary'){config.innerHTML='<h3>Boundary</h3><div class="helper">Tap each corner. Finish closes the boundary. Every point can be moved afterwards.</div>';return}if(activeTool==='main'){config.innerHTML='<h3>Main</h3>'+sizeButtons('main',[25,32,40,50,63,90])+mats('main',['PVC','HDPE','Oval Hose'])+connectRow('main')+'<div class="helper">PVC default. Connect can attach to another Main or Submain.</div>';wire('main');return}if(activeTool==='submain'){config.innerHTML='<h3>Submain</h3>'+sizeButtons('submain',[25,32,40,50,63,90])+mats('submain',['PVC','HDPE','Oval Hose'])+connectRow('submain')+'<div class="helper">PVC default. Connection can slide, detach and reattach.</div>';wire('submain');return}if(activeTool==='lateral'){config.innerHTML='<h3>Lateral</h3>'+sizeButtons('lateral',[12,16,20])+'<div class="materialRow"><label><input type="radio" checked disabled> LLDPE</label></div>'+connectRow('lateral')+'<div class="helper">Connection can slide along Main/Submain or be moved to another one.</div>';wire('lateral');return}if(activeTool==='emitter'){config.innerHTML='<h3>Emitter</h3><div class="helper">Emitter choices will be added later.</div>';return}config.innerHTML='<h3>Fittings</h3><div class="placeholderGrid"><div class="placeholder">Fitting</div><div class="placeholder">Fitting</div><div class="placeholder">Fitting</div></div><div class="helper">Images will be inserted later.</div>'}function wire(t){config.querySelectorAll('[data-size]').forEach(b=>b.onclick=()=>{state[t].size=+b.dataset.size;renderConfig()});config.querySelectorAll(`input[name="${t}Material"]`).forEach(r=>r.onchange=()=>state[t].material=r.value);const c=$('#connectCheck');if(c)c.onchange=()=>state[t].connect=c.checked}renderConfig();
function beginDraft(t){clearDraft();clearSelection();activeTool=t;if(!['boundary','main','submain','lateral'].includes(t)){activeBar.classList.remove('show');return}draft={kind:t,points:[],layer:null,markers:[],connectedTo:null};activeBar.classList.add('show');toolNameBar.textContent=titleFor(t);map.doubleClickZoom.disable()}function clearDraft(){if(!draft)return;if(draft.layer&&map.hasLayer(draft.layer))map.removeLayer(draft.layer);draft.markers.forEach(m=>map.hasLayer(m)&&map.removeLayer(m));draft=null;map.doubleClickZoom.enable()}function redrawDraft(){if(!draft)return;if(draft.layer&&map.hasLayer(draft.layer))map.removeLayer(draft.layer);draft.markers.forEach(m=>map.hasLayer(m)&&map.removeLayer(m));draft.markers=[];if(!draft.points.length)return;draft.layer=draft.kind==='boundary'?L.polygon(draft.points,styles.boundary).addTo(map):L.polyline(draft.points,styles[draft.kind]).addTo(map);draft.points.forEach((p,i)=>draft.markers.push(L.marker(p,{icon:icon(i===0&&!!draft.connectedTo,true),interactive:false}).addTo(map)))}
function compatibleParents(kind,exclude){return objects.filter(o=>o!==exclude&&o.kind!=='boundary'&&(kind==='submain'?o.kind==='main':kind==='lateral'?(o.kind==='main'||o.kind==='submain'):(o.kind==='main'||o.kind==='submain')))}function closestOnSegment(p,a,b){const P=map.latLngToLayerPoint(p),A=map.latLngToLayerPoint(a),B=map.latLngToLayerPoint(b),dx=B.x-A.x,dy=B.y-A.y,l=dx*dx+dy*dy;if(!l)return{ll:a,d:P.distanceTo(A)};let t=((P.x-A.x)*dx+(P.y-A.y)*dy)/l;t=Math.max(0,Math.min(1,t));const Q=L.point(A.x+t*dx,A.y+t*dy);return{ll:map.layerPointToLatLng(Q),d:P.distanceTo(Q)}}function nearestParent(p,kind,exclude,maxPx=30){let best=null;compatibleParents(kind,exclude).forEach(o=>{for(let i=0;i<o.points.length-1;i++){const q=closestOnSegment(p,o.points[i],o.points[i+1]);if(q.d<maxPx&&(!best||q.d<best.d))best={obj:o,ll:q.ll,d:q.d}}});return best}function addDraftPoint(p,parent=null){if(!draft)return;if(draft.points.length===0&&parent){draft.connectedTo=parent}draft.points.push(p);redrawDraft()}
map.on('click',e=>{if(palette.classList.contains('open'))return;if(draft){let p=e.latlng;if(draft.points.length===0&&state[draft.kind]&&state[draft.kind].connect){const s=nearestParent(p,draft.kind,null,34);if(s){p=s.ll;draft.connectedTo=s.obj}}addDraftPoint(p,draft.connectedTo);return}clearSelection()});$('#finishBtn').onclick=()=>finishDraft();$('#cancelBtn').onclick=()=>{clearDraft();activeBar.classList.remove('show')};
function finishDraft(){if(!draft)return;const min=draft.kind==='boundary'?3:2;if(draft.points.length<min)return;const o={id:++seq,kind:draft.kind,points:draft.points.slice(),size:state[draft.kind]?.size||null,material:state[draft.kind]?.material||null,connectedTo:draft.connectedTo,layer:null};clearDraft();o.layer=o.kind==='boundary'?L.polygon(o.points,styles.boundary).addTo(map):L.polyline(o.points,styles[o.kind]).addTo(map);objects.push(o);wireObject(o);selectObject(o);activeBar.classList.remove('show')}
function wireObject(o){o.layer.on('click',e=>{L.DomEvent.stopPropagation(e);if(draft){if(draft.points.length===0&&state[draft.kind]?.connect&&compatibleParents(draft.kind,null).includes(o)){let best={d:Infinity,ll:e.latlng};for(let i=0;i<o.points.length-1;i++){const q=closestOnSegment(e.latlng,o.points[i],o.points[i+1]);if(q.d<best.d)best=q}addDraftPoint(best.ll,o);return}addDraftPoint(e.latlng,null);return}if(selected===o){const pos=insertPointAt(o,e.latlng);selectObject(o,pos)}else selectObject(o)})}
function clearSelection(){vertexMarkers.forEach(m=>map.hasLayer(m)&&map.removeLayer(m));vertexMarkers=[];selected=null}function selectObject(o){clearSelection();selected=o;o.points.forEach((p,i)=>{const m=L.marker(p,{draggable:true,icon:icon(i===0&&!!o.connectedTo,false)}).addTo(map);m.on('drag',ev=>dragVertex(o,i,ev.target));m.on('dragend',()=>finishVertexDrag(o,i,m));m.on('click',ev=>L.DomEvent.stopPropagation(ev));vertexMarkers.push(m)})}function dragVertex(o,i,m){let p=m.getLatLng();if(i===0&&state[o.kind]?.connect){const s=nearestParent(p,o.kind,o,34);if(s){p=s.ll;m.setLatLng(p);o.connectedTo=s.obj}else o.connectedTo=null}o.points[i]=p;refreshObject(o);refreshMarkerIcons(o)}function finishVertexDrag(o,i,m){if(i===0&&state[o.kind]?.connect){const s=nearestParent(m.getLatLng(),o.kind,o,40);if(s){o.connectedTo=s.obj;o.points[0]=s.ll;m.setLatLng(s.ll)}else o.connectedTo=null}refreshObject(o);refreshMarkerIcons(o)}function refreshMarkerIcons(o){vertexMarkers.forEach((m,i)=>m.setIcon(icon(i===0&&!!o.connectedTo,false)))}function refreshObject(o){o.layer.setLatLngs(o.kind==='boundary'?[o.points]:o.points)}function insertPointAt(o,p){if(o.points.length<2)return null;let best={d:Infinity,index:1,ll:p};const limit=o.kind==='boundary'?o.points.length:o.points.length-1;for(let i=0;i<limit;i++){const a=o.points[i],b=o.points[(i+1)%o.points.length],q=closestOnSegment(p,a,b);if(q.d<best.d)best={d:q.d,index:i+1,ll:q.ll}}if(best.d>24)return null;o.points.splice(best.index,0,best.ll);refreshObject(o);return best.index}
async function searchPlace(){const q=$('#placeSearch').value.trim();if(!q)return;const d=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/);if(d){map.setView([+d[1],+d[2]],19);return}try{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent(q));const x=await r.json();if(x[0])map.setView([+x[0].lat,+x[0].lon],19)}catch(e){}}$('#searchBtn').onclick=searchPlace;$('#placeSearch').onkeydown=e=>{if(e.key==='Enter')searchPlace()};$('#locateBtn').onclick=()=>navigator.geolocation&&navigator.geolocation.getCurrentPosition(p=>{const ll=[p.coords.latitude,p.coords.longitude];map.setView(ll,19);if(locationMarker)locationMarker.setLatLng(ll);else locationMarker=L.circleMarker(ll,{radius:6,weight:2,color:'#fff',fillColor:'#1677ff',fillOpacity:1,interactive:false}).addTo(map)},()=>{},{enableHighAccuracy:true,timeout:12000,maximumAge:30000});
</script></body></html>
