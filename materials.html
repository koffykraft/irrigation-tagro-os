<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TAGRO Materials</title><style>body{font-family:system-ui;margin:0;background:#f6f7f5;color:#202420}header{display:flex;gap:10px;align-items:center;padding:12px 14px;background:#fff;border-bottom:1px solid #ddd}a{color:#075d9e;text-decoration:none;font-weight:700}main{padding:14px;max-width:800px;margin:auto}.card{background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:8px;border-bottom:1px solid #eee}</style></head><body><header><a href="location-map.html">← Map / Sketch</a><a href="design.html">Design</a><b>Material list</b><a href="reference.html">Info</a></header><main><div class="card"><table><thead><tr><th>Role</th><th>Size</th><th>Material</th><th>Objects</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const d=JSON.parse(localStorage.getItem('tagro.v16.trial.workspace.v1')||'null'),ls=(d?.layers||[]).filter(x=>['main','submain','lateral'].includes(x.identity)),m=new Map();ls.forEach(x=>{const size=x.engineering?.size||'Unspecified',mat=x.engineering?.material||'Unspecified',k=[x.identity,size,mat].join('|');m.set(k,(m.get(k)||0)+1)});document.querySelector('#rows').innerHTML=[...m].map(([k,n])=>{const [r,s,mat]=k.split('|');return`<tr><td>${r}</td><td>${s}${s!=='Unspecified'?' mm':''}</td><td>${mat}</td><td>${n}</td></tr>`}).join('')||'<tr><td colspan="4">No saved pipe materials yet.</td></tr>';</script></body></html>
