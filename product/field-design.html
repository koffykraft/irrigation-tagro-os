<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#f7f8f5"><title>TAGRO Field Design</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"><link rel="stylesheet" href="field-design.css"></head>
<body><div class="app">
<header class="topbar"><button id="backBtn" class="icon">←</button><div class="title"><strong>Field design</strong><span id="projectName">Irrigation job</span></div><button id="layerBtn" class="pill">Imagery</button></header>
<main class="stage"><div id="map" class="map"></div><div id="status" class="status">Find the field. Add a boundary or start the water network.</div><div id="summary" class="summary"></div><div id="reticle" class="reticle hidden"><span></span></div>
<div class="mapbuttons"><button id="locateBtn" aria-label="My location">◎</button><button id="fitBtn" aria-label="Fit design">⌗</button></div>
<section id="addSheet" class="sheet hidden"><div class="sheethead"><strong>Add to design</strong><button data-close="addSheet">×</button></div><div class="cards"><button data-add="boundary"><b>Field boundary</b><small>Define a plot or irrigation area</small></button><button data-add="source"><b>Water source</b><small>Well, tank, pond or inlet</small></button><button data-add="main"><b>Main</b><small>Start the water path</small></button><button data-add="submain"><b>Submain</b><small>Must begin from a Main</small></button><button data-add="lateral"><b>Lateral</b><small>Must begin from a Submain</small></button></div></section>
<section id="selectSheet" class="sheet hidden"><div class="sheethead"><div><small id="selectedType">Object</small><strong id="selectedName">Selected</strong></div><button data-close="selectSheet">×</button></div><div id="selectedStats" class="stats"></div><div id="selectedLogic" class="logic"></div><div class="actions"><button id="editBtn">Edit points</button><button id="moveBtn">Move</button><button id="deleteBtn" class="danger">Delete</button></div><div id="downstreamActions" class="downstream"></div></section>
<section id="layerSheet" class="sheet hidden"><div class="sheethead"><strong>Map view</strong><button data-close="layerSheet">×</button></div><button class="row" data-map="imagery"><span><b>Imagery</b><small>Field edges and vegetation</small></span></button><button class="row" data-map="street"><span><b>Map</b><small>Roads and place context</small></span></button></section>
<section id="exitSheet" class="sheet hidden"><div class="sheethead"><strong>Field design is saved</strong><button data-close="exitSheet">×</button></div><p>Return to the irrigation job without losing this design or map position.</p><button id="returnBtn" class="wide primary">Return to irrigation job</button><button data-close="exitSheet" class="wide">Stay here</button></section>
</main>
<footer id="normalDock" class="dock"><button id="selectTool" class="active"><span>↖</span><small>Select</small></button><button id="addTool" class="primary"><span>＋</span><small>Add</small></button><button id="measureTool"><span>↔</span><small>Measure</small></button><button id="undoTool" disabled><span>↶</span><small>Undo</small></button><button id="redoTool" disabled><span>↷</span><small>Redo</small></button></footer>
<footer id="placeDock" class="place hidden"><button id="cancelBtn">Cancel</button><div><strong id="actionTitle">Drawing</strong><span id="actionHint">Move the map under the crosshair</span></div><button id="undoPointBtn" disabled>Undo</button><button id="placeBtn" class="primary">Place</button><button id="finishBtn" class="primary hidden">Finish</button></footer>
</div><script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script type="module" src="field-design.js"></script></body></html>
