<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#0b1510"><title>TAGRO Field Designer</title><link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css"><link rel="stylesheet" href="field-workspace.css"></head><body><div id="workspace" class="workspace"><header class="workspace-head"><button id="backBtn" class="icon-btn" aria-label="Back">←</button><div class="head-copy"><strong>Field Designer</strong><span id="projectName">TAGRO Irrigation</span></div><div class="head-actions"><button id="mapStyleBtn" class="text-btn">Satellite</button><button id="doneBtn" class="done-btn">Done</button></div></header><main class="map-stage"><div id="map" class="map"></div><div class="map-status" id="mapStatus">Pan and zoom to the field, then choose a tool.</div><div class="tool-rail" aria-label="Drawing tools"><button class="rail-tool active" data-tool="select"><span>↖</span><small>Select</small></button><button class="rail-tool" data-tool="boundary"><span>⬡</span><small>Boundary</small></button><button class="rail-tool" data-tool="source"><span>●</span><small>Source</small></button><button class="rail-tool" data-tool="pipe"><span>⌁</span><small>Pipe</small></button><button class="rail-tool" data-tool="measure"><span>↔</span><small>Measure</small></button><button class="rail-tool" id="locateBtn"><span>◎</span><small>Locate</small></button></div><section id="objectPalette" class="object-palette hidden" aria-label="Object type"><div class="palette-title"><strong>What are you drawing?</strong><button id="closePalette" aria-label="Close">×</button></div><div class="palette-grid"><button data-object="main"><span class="swatch main"></span>Main</button><button data-object="submain"><span class="swatch submain"></span>Submain</button><button data-object="lateral"><span class="swatch lateral"></span>Lateral</button></div></section><section id="selectionSheet" class="selection-sheet hidden"><div class="sheet-grip"></div><div class="selection-top"><div><small id="selectedKind">Object</small><strong id="selectedTitle">Selected</strong></div><button id="closeSelection" class="icon-btn">×</button></div><div id="selectionMeta" class="selection-meta"></div><div class="selection-actions"><button id="editBtn">Edit</button><button id="moveBtn">Move</button><button id="deleteBtn" class="danger">Delete</button></div></section><div id="snapHint" class="snap-hint hidden">Snap</div><div id="measureBadge" class="measure-badge hidden"></div></main><footer class="command-bar"><button id="undoBtn" disabled><span>↶</span><small>Undo</small></button><button id="redoBtn" disabled><span>↷</span><small>Redo</small></button><button id="cancelBtn" class="hidden"><span>×</span><small>Cancel</small></button><div class="command-spacer"></div><button id="finishBtn" class="finish hidden"><span>✓</span><small>Finish</small></button></footer></div><script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script><script src="https://cdn.jsdelivr.net/npm/@turf/turf@7/turf.min.js"></script><script type="module" src="field-workspace.js"></script></body></html>
