<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f0ea">
<title>TAGRO Irrigation</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app" id="app">
<header class="topbar">
  <button class="brand" data-action="home"><span>TAGRO</span><small>Irrigation</small></button>
  <div class="project-title" id="projectTitle">New irrigation job</div>
  <div class="top-actions">
    <button class="ghost" data-action="export">Export</button>
    <button class="ghost" data-action="import">Import</button>
  </div>
</header>

<main id="view" class="view" aria-live="polite"></main>

<nav class="dockbar" id="dockbar" aria-label="Project navigation">
  <button data-route="purpose"><span>◎</span><small>Purpose</small></button>
  <button data-route="farm"><span>◌</span><small>Farm</small></button>
  <button data-route="field"><span>⌖</span><small>Field</small></button>
  <button data-route="water"><span>◒</span><small>Water</small></button>
  <button data-route="application"><span>✣</span><small>Apply</small></button>
  <button data-route="network"><span>⌁</span><small>Network</small></button>
  <button data-route="review"><span>✓</span><small>Review</small></button>
</nav>
</div>
<input id="importFile" type="file" accept="application/json" hidden>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="https://unpkg.com/@geoman-io/leaflet-geoman-free@2.18.0/dist/leaflet-geoman.min.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
